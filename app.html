<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRACARYS AI — Autonomous Desktop & Web Assistant</title>
    <link rel="shortcut icon" href="assets/img/sophia.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Bootstrap Icons & FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="theme-cyan mode-dark">
    <!-- Live Announcer for Accessibility -->
    <div id="srAnnouncer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

    <div class="ai-app-viewport">
        <!-- ==================== 3D INTERACTIVE & VIDEO DRAGON BACKGROUND ==================== -->
        <div id="dragonBackgroundContainer" class="dragon-bg-container" aria-hidden="true">
            <canvas id="dragon3DCanvas" class="dragon-canvas"></canvas>
            <video id="dragonVideoPlayer" class="dragon-video-layer" loop muted playsinline></video>
            <div class="dragon-ambient-vignette"></div>
        </div>

        <!-- ==================== MINIMAL TOP HEADER ==================== -->
        <header class="minimal-header d-flex justify-content-between align-items-center px-4 py-3">
            <div class="header-brand d-flex align-items-center gap-2">
                <span class="brand-orb-dot"></span>
                <span class="brand-title">DRACARYS</span>
                <span id="visualizerStateBadge" class="state-badge state-idle">
                    <span class="state-pulse-dot"></span>
                    <span id="stateBadgeText">Ready</span>
                </span>
            </div>

            <!-- Header Controls with 3D Dragon & Voice tools -->
            <div class="header-actions d-flex align-items-center gap-2">
                <button id="btnDragonDracarys" class="icon-tool-btn dragon-fire-btn" title="Dracarys! Unleash 3D Dragonfire (D / Click)" aria-label="Unleash dragonfire">
                    <i class="bi bi-fire text-warning"></i>
                </button>

                <button id="btnCancelSpeech" class="icon-tool-btn" title="Stop Speech Playback (Esc)" aria-label="Stop audio">
                    <i class="bi bi-stop-circle"></i>
                </button>
                <button id="ChatBtn" class="icon-tool-btn" data-bs-toggle="offcanvas" data-bs-target="#historyOffcanvas" title="Task & Conversation History (Ctrl+H)" aria-label="Open history">
                    <i class="bi bi-clock-history"></i>
                </button>
                <button id="RefreshBtn" class="icon-tool-btn" title="Refresh & Reset Assistant" aria-label="Reset assistant">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
                <button id="SettingsBtn" class="icon-tool-btn" data-bs-toggle="offcanvas" data-bs-target="#settingsOffcanvas" title="Voice & Language Settings (Ctrl+,)" aria-label="Open settings">
                    <i class="bi bi-sliders"></i>
                </button>
            </div>
        </header>

        <!-- ==================== MAIN HERO AI SECTION ==================== -->
        <main class="hero-center-stage d-flex flex-column align-items-center justify-content-center">
            
            <!-- THE FUTURISTIC GLOWING AI ORB (Matching reference image media_1790239592117.png) -->
            <div id="aiOrbContainer" class="ai-orb-container" role="button" tabindex="0" title="Click Orb to Speak (English / हिंदी)">
                <!-- Ambient Backglow Aura -->
                <div class="orb-aura-glow"></div>

                <!-- Outer Specular Ring & Sphere -->
                <div class="ai-orb-sphere" id="aiOrbSphere">
                    <!-- Top Specular Crescent Light Highlight -->
                    <div class="specular-crescent top-crescent"></div>

                    <!-- Inner Radial Atmosphere Core -->
                    <div class="orb-core">
                        <!-- Cyan Harmonic Sine Wave Visualizer -->
                        <div class="orb-wave-container">
                            <canvas id="audioVisualizerCanvas" width="280" height="90"></canvas>
                        </div>

                        <!-- Centered Greeting / Dynamic Spoken Text -->
                        <div class="orb-text-wrapper">
                            <p id="siriMessageText" class="orb-message-text">Hi, how can i Help you ...</p>
                        </div>
                    </div>

                    <!-- Bottom Specular Crescent Light Highlight -->
                    <div class="specular-crescent bottom-crescent"></div>
                </div>

                <!-- Subtle Pulse Rings on Voice Listening -->
                <div class="listening-pulse-ring ring-1"></div>
                <div class="listening-pulse-ring ring-2"></div>
            </div>

            <!-- ==================== MINIMALIST FLOATING INPUT DOCK ==================== -->
            <div class="floating-dock-container mt-4">
                <!-- Status & Language Bar -->
                <div class="dock-meta-bar d-flex justify-content-between align-items-center px-3 mb-1">
                    <span id="detectedLangPill" class="detected-lang-badge">
                        <i class="bi bi-translate text-info me-1"></i>
                        <span id="detectedLangText">Auto: English / हिंदी / Hinglish</span>
                    </span>
                    <span id="micLiveStatusBadge" class="mic-live-badge d-none">
                        <span class="pulse-dot-red"></span> Listening (English / Hindi)...
                    </span>
                </div>

                <!-- Sleek Glass Pill Dock -->
                <div id="textInput" class="minimal-pill-dock d-flex align-items-center">
                    <!-- Prominent Microphone Button -->
                    <button id="MicBtn" class="pill-mic-btn" title="Voice Input: Speak in English or Hindi (Ctrl+M)" aria-label="Start voice recognition">
                        <i class="bi bi-mic-fill"></i>
                    </button>

                    <!-- Text Input Field -->
                    <input type="text" class="pill-input-field" name="chatbox" id="chatbox"
                        placeholder="Ask in English or हिन्दी..."
                        aria-label="Command and message input" autocomplete="off" spellcheck="false">

                    <!-- Auxiliary Document Upload (Discrete) -->
                    <button id="UploadBtn" class="pill-tool-btn" title="Upload Document for Analysis (Ctrl+U)" aria-label="Upload document">
                        <i class="bi bi-paperclip"></i>
                    </button>
                    <input type="file" id="docFileInput" style="display: none;" accept=".txt,.pdf,.docx,.doc,.csv,.json,.md" aria-label="File upload input">

                    <!-- Send Button -->
                    <button id="SendBtn" class="pill-send-btn" title="Send (Enter)" aria-label="Send command">
                        <i class="bi bi-arrow-up-circle-fill"></i>
                    </button>
                </div>
            </div>

            <!-- ==================== MINIMALIST LIVE RESPONSE CARD ==================== -->
            <div id="activeResponseCard" class="active-response-card mt-3" style="display: none;">
                <div class="response-card-inner">
                    <div class="response-header d-flex justify-content-between align-items-center mb-2">
                        <div class="d-flex align-items-center gap-2">
                            <span class="response-tag"><i class="bi bi-cpu-fill text-info me-1"></i>Assistant</span>
                            <span id="responseLangBadge" class="badge bg-secondary bg-opacity-25 text-info font-monospace" style="font-size: 0.72rem;">EN</span>
                        </div>
                        <div class="d-flex align-items-center gap-1">
                            <button id="btnReplayResponse" class="card-action-btn" title="Replay Audio Voice"><i class="bi bi-volume-up"></i></button>
                            <button id="btnCopyResponse" class="card-action-btn" title="Copy Response Text"><i class="bi bi-clipboard"></i></button>
                            <button id="btnCloseResponse" class="card-action-btn" title="Dismiss Card"><i class="bi bi-x-lg"></i></button>
                        </div>
                    </div>
                    <div id="responseQueryEcho" class="response-query-echo mb-2"></div>
                    <div id="responseBodyContent" class="response-body-content"></div>
                </div>
            </div>

            <!-- Hidden compatibility containers for src/ts references -->
            <div id="conversationStreamWrapper" style="display: none;">
                <div id="conversationFeedList"></div>
                <div id="feedThinkingIndicator" style="display: none;"></div>
                <button id="btnClearFeed"></button>
                <button id="btnToggleFeedView"></button>
            </div>
            <div id="domainChipsContainer" style="display: none;"></div>
            <div id="Oval" style="display: none;"></div>
            <div id="SiriWave" style="display: none;">
                <button id="btnRetryVoice" style="display: none;"></button>
                <button id="btnSwitchToText" style="display: none;"></button>
            </div>
            <div id="assistantDisplayTitle" style="display: none;">DRACARYS</div>
            <button id="LogsBtn" style="display: none;"></button>
            <button id="WidgetsBtn" style="display: none;"></button>
            <button id="QuickActionsBtn" style="display: none;"></button>
        </main>
    </div>

    <!-- Floating Error & Reliability Alert Container -->
    <div id="errorToastContainer" class="position-fixed top-0 end-0 p-3" style="z-index: 1090;"></div>

    <!-- History Offcanvas (Accessible via Top Header History Button) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="historyOffcanvas">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title"><i class="bi bi-clock-history me-2"></i>Task History
                <span id="historyCountBadge" class="badge bg-secondary ms-1">0</span></h5>
            <div class="d-flex gap-2 align-items-center">
                <button id="btnRefreshHistory" class="btn-action-icon" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
            </div>
        </div>
        <div class="offcanvas-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-muted small">Recent voice &amp; chat tasks</span>
                <button id="btnClearHistory" class="btn btn-sm btn-outline-danger" style="font-size:0.75rem;"><i class="bi bi-trash me-1"></i>Clear All</button>
            </div>
            <div id="historyListContainer" class="history-list">
                <div class="text-center text-muted p-4" style="font-size:0.85rem;">No tasks recorded yet.</div>
            </div>
        </div>
    </div>

    <!-- Settings Offcanvas (Accessible via Top Header Settings Button) -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="settingsOffcanvas">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title"><i class="bi bi-sliders me-2"></i>Voice &amp; Assistant Settings</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <!-- UI Customization & Accessibility Controls -->
            <div class="custom-setting-group">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label class="mb-0"><i class="bi bi-brightness-high me-1"></i> Light Theme Mode</label>
                    <div class="form-check form-switch m-0">
                        <input class="form-check-input" type="checkbox" id="toggleThemeMode">
                    </div>
                </div>
            </div>

            <div class="custom-setting-group mt-3">
                <label><i class="bi bi-palette me-1"></i> Accent Color Palette</label>
                <div class="accent-btn-picker">
                    <button class="accent-btn active" data-accent="cyan"><span class="accent-dot" style="background:#00d4ff;"></span> Cyan</button>
                    <button class="accent-btn" data-accent="fire"><span class="accent-dot" style="background:#ff4500;"></span> Fire</button>
                    <button class="accent-btn" data-accent="emerald"><span class="accent-dot" style="background:#00ff88;"></span> Emerald</button>
                    <button class="accent-btn" data-accent="purple"><span class="accent-dot" style="background:#b000ff;"></span> Purple</button>
                    <button class="accent-btn" data-accent="crimson"><span class="accent-dot" style="background:#ff3366;"></span> Crimson</button>
                    <button class="accent-btn" data-accent="blue"><span class="accent-dot" style="background:#2979ff;"></span> Blue</button>
                    <button class="accent-btn" data-accent="amber"><span class="accent-dot" style="background:#ffb703;"></span> Amber</button>
                    <button class="accent-btn" data-accent="stealth"><span class="accent-dot" style="background:#e0e0e0;"></span> Stealth</button>
                </div>
            </div>

            <div class="custom-setting-group mt-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <label class="mb-0"><i class="bi bi-eye-slash me-1"></i> Reduced Motion</label>
                        <div class="text-muted" style="font-size:0.75rem;">Disables glowing pulses</div>
                    </div>
                    <div class="form-check form-switch m-0">
                        <input class="form-check-input" type="checkbox" id="toggleReducedMotion">
                    </div>
                </div>
            </div>

            <div class="section-divider"></div>

            <!-- Assistant Configuration -->
            <div class="custom-setting-group">
                <label><i class="bi bi-person-badge me-1"></i> Assistant Name</label>
                <input type="text" id="settingAssistantName" class="custom-input" placeholder="e.g. Dracarys">
            </div>
            <div class="custom-setting-group mt-3">
                <label><i class="bi bi-translate me-1"></i> Speech Recognition Language</label>
                <select id="settingSpeechLang" class="custom-input mb-2">
                    <option value="en-IN">Auto / Hinglish &amp; English (en-IN)</option>
                    <option value="hi-IN">Hindi (हिंदी - hi-IN)</option>
                    <option value="en-US">English US (en-US)</option>
                </select>
            </div>
            <div class="custom-setting-group mt-2">
                <label><i class="bi bi-mic me-1"></i> Hindi Neural Voice</label>
                <select id="settingHindiVoice" class="custom-input mb-2">
                    <option value="hi-IN-SwaraNeural">Swara (Female Neural)</option>
                    <option value="hi-IN-MadhurNeural">Madhur (Male Neural)</option>
                </select>
                <button id="btnTestHindiVoice" class="btn-secondary-custom w-100 mb-2"><i class="bi bi-volume-up me-1"></i> 🔊 Test Hindi Voice</button>
            </div>
            <div class="custom-setting-group mt-2">
                <label><i class="bi bi-soundwave me-1"></i> English Neural Voice</label>
                <select id="settingEnglishVoice" class="custom-input mb-2">
                    <option value="en-IN-NeerjaNeural">Neerja (Indian Female Neural)</option>
                    <option value="en-IN-PrabhatNeural">Prabhat (Indian Male Neural)</option>
                    <option value="en-US-JennyNeural">Jenny (US Female Neural)</option>
                    <option value="en-US-GuyNeural">Guy (US Male Neural)</option>
                </select>
                <button id="btnTestEnglishVoice" class="btn-secondary-custom w-100 mb-2"><i class="bi bi-volume-up me-1"></i> 🔊 Test English Voice</button>
            </div>

            <div class="section-divider"></div>

            <!-- Background Image Customizer -->
            <div class="custom-setting-group mt-3">
                <label><i class="bi bi-image me-1"></i> Background Image</label>
                <div class="bg-preset-grid">
                    <button class="bg-preset-btn active" data-bg="none" title="No background image">
                        <span class="bg-preset-thumb bg-preset-none">
                            <i class="bi bi-slash-circle" style="font-size:1.2rem; opacity:0.6;"></i>
                        </span>
                        <span class="bg-preset-label">None</span>
                    </button>
                    <button class="bg-preset-btn" data-bg="nebula" title="Nebula">
                        <span class="bg-preset-thumb" style="background:linear-gradient(135deg,#0d0221 0%,#1a0533 40%,#7b2d8b 70%,#e040fb 100%);"></span>
                        <span class="bg-preset-label">Nebula</span>
                    </button>
                    <button class="bg-preset-btn" data-bg="aurora" title="Aurora">
                        <span class="bg-preset-thumb" style="background:linear-gradient(135deg,#001122 0%,#003322 40%,#00aa66 70%,#00ffcc 100%);"></span>
                        <span class="bg-preset-label">Aurora</span>
                    </button>
                    <button class="bg-preset-btn" data-bg="space" title="Deep Space">
                        <span class="bg-preset-thumb" style="background:linear-gradient(135deg,#000005 0%,#050018 50%,#0a0030 100%); background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.15) 0px, transparent 1px), radial-gradient(circle at 70% 60%, rgba(255,255,255,0.1) 0px, transparent 1px), radial-gradient(circle at 50% 80%, rgba(255,255,255,0.12) 0px, transparent 1px);"></span>
                        <span class="bg-preset-label">Space</span>
                    </button>
                    <button class="bg-preset-btn" data-bg="forest" title="Dark Forest">
                        <span class="bg-preset-thumb" style="background:linear-gradient(135deg,#020c04 0%,#051a08 40%,#0a3311 70%,#0d4a17 100%);"></span>
                        <span class="bg-preset-label">Forest</span>
                    </button>
                    <button class="bg-preset-btn" data-bg="abstract" title="Abstract Neon">
                        <span class="bg-preset-thumb" style="background:linear-gradient(135deg,#0d0d0d 0%,#1a0a3a 30%,#0a1a3a 60%,#001f3f 100%);"></span>
                        <span class="bg-preset-label">Abstract</span>
                    </button>
                </div>
                <!-- Custom upload -->
                <label class="bg-upload-btn mt-2" title="Upload your own background image">
                    <i class="bi bi-upload me-1"></i> Upload Custom Image
                    <input type="file" id="bgImageUploadInput" style="display:none;" accept="image/*">
                </label>
            </div>

            <div class="section-divider mt-4 mb-3"></div>
            <div class="mt-2 mb-3">
                <button id="btnSaveSettings" class="btn-primary-custom mb-2"><i class="bi bi-check2-circle me-1"></i> Save Preferences</button>
                <button id="btnResetState" class="btn-secondary-custom w-100 mt-2" style="font-size:0.82rem;"><i class="bi bi-shield-check me-1"></i> Reset Assistant State</button>
            </div>
        </div>
    </div>

    <!-- Hidden Modals and Offcanvas to retain underlying subsystem capabilities -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="widgetsOffcanvas" style="display: none;">
        <div class="offcanvas-body">
            <button id="btnRefreshWidgets"></button>
            <div id="widgetCpuVal"></div>
            <div id="widgetRamVal"></div>
            <div id="widgetBatVal"></div>
            <div id="widgetWorldClockContainer"></div>
            <input type="text" id="widgetInputTask">
            <button id="btnWidgetAddTask"></button>
            <div id="widgetTasksList"></div>
            <input type="text" id="widgetInputNote">
            <button id="btnWidgetAddNote"></button>
            <div id="widgetNotesList"></div>
            <div id="widgetCalendarList"></div>
        </div>
    </div>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="logsOffcanvas" style="display: none;">
        <div class="offcanvas-body">
            <span id="diagOverallBadge"></span>
            <button id="btnRunDiagnostics"></button>
            <div id="diagSubsystemsList"></div>
            <span id="logsCountBadge"></span>
            <button id="btnRefreshLogs"></button>
            <button id="btnClearLogs"></button>
            <input type="text" id="logSearchInput">
            <div id="liveLogsContainer"></div>
        </div>
    </div>

    <!-- Quick Actions Modal (Ctrl+K) -->
    <div class="modal fade" id="quickActionsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-md">
            <div class="modal-content" style="background: rgba(14, 18, 25, 0.98); border: 1px solid rgba(0, 240, 255, 0.35); backdrop-filter: blur(25px); color: #f0f6fc; border-radius: 16px;">
                <div class="modal-header border-0 pb-1 pt-3 px-3">
                    <div class="input-group w-100 align-items-center" style="background: rgba(255,255,255,0.06); border-radius: 10px; padding: 2px 8px;">
                        <span class="text-info fs-5 ps-2"><i class="bi bi-search"></i></span>
                        <input type="text" id="quickActionSearch" class="form-control bg-transparent text-light border-0 fs-6 shadow-none" placeholder="Type a command, app, or website..." autofocus autocomplete="off">
                        <span class="badge bg-secondary align-self-center me-1 font-monospace opacity-75" style="font-size:0.7rem;">ESC</span>
                    </div>
                </div>
                <div class="modal-body px-3 pt-2 pb-2">
                    <div id="quickActionsList" style="max-height: 380px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Confirmation Modal -->
    <div class="modal fade" id="actionConfirmationModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-sm" style="max-width: 420px;">
            <div class="modal-content" style="background: rgba(18, 20, 28, 0.98); border: 1px solid rgba(255, 193, 7, 0.45); backdrop-filter: blur(25px); color: #f0f6fc; border-radius: 16px;">
                <div class="modal-body p-4 text-center">
                    <div class="mb-3">
                        <div class="rounded-circle d-inline-flex align-items-center justify-content-center p-3" style="background: rgba(255, 193, 7, 0.15); color: #ffc107; font-size: 2.2rem;">
                            <i class="bi bi-shield-exclamation"></i>
                        </div>
                    </div>
                    <h5 class="fw-bold mb-2 text-warning">Confirmation Required</h5>
                    <p id="actionConfirmationPrompt" class="text-muted small mb-4"></p>
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="button" id="btnConfirmActionCancel" class="btn btn-sm btn-outline-secondary px-3 py-2 flex-grow-1" style="border-radius: 10px;">Cancel</button>
                        <button type="button" id="btnConfirmActionProceed" class="btn btn-sm btn-warning text-dark fw-bold px-3 py-2 flex-grow-1" style="border-radius: 10px;">Proceed</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Document Analysis Result Modal -->
    <div class="modal fade" id="docAnalysisModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content" style="background: rgba(14, 17, 23, 0.98); border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(25px); color: #f0f6fc; border-radius: 14px;">
                <div class="modal-header" style="border-bottom: 1px solid rgba(255,255,255,0.1); padding: 16px 22px;">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-file-earmark-text text-info" style="font-size: 1.3rem;"></i>
                        <div>
                            <h5 class="modal-title mb-0" id="docModalFilename" style="font-weight: 700; font-size: 1.05rem;">Document Analysis</h5>
                            <span class="text-muted" style="font-size: 0.75rem;"><span id="docModalSize" class="me-2"></span><span id="docModalWords"></span></span>
                        </div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" style="padding: 22px; max-height: 60vh; overflow-y: auto;">
                    <div id="docModalContent" style="font-size: 0.9rem; line-height: 1.6; color: #c9d1d9;"></div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid rgba(255,255,255,0.1); padding: 12px 22px;">
                    <button id="btnCopyDocSummary" class="btn btn-sm btn-outline-info" style="border-radius: 8px;"><i class="bi bi-clipboard me-1"></i>Copy Summary</button>
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal" style="border-radius: 8px;">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <!-- Three.js 3D WebGL Engine (CDN with local fallback) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        if (typeof THREE === "undefined") {
            document.write('<script src="assets/vendore/three.min.js"><\/script>');
        }
